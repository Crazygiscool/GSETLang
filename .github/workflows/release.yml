name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }} -p gset-cli
          else
            cargo build --release --target ${{ matrix.target }} -p gset-cli
          fi
        shell: bash

      - name: Resolve artifact path
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/gset"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          echo "BIN=${BIN}" >> "$GITHUB_ENV"
          OUTPUT_NAME="gset-$(echo ${{ matrix.os }} | sed 's/-latest//' | sed 's/ubuntu/linux/;s/macos/darwin/')"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            OUTPUT_NAME="gset-windows-amd64"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            OUTPUT_NAME="gset-darwin-arm64"
          elif [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            OUTPUT_NAME="gset-darwin-amd64"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            OUTPUT_NAME="gset-linux-amd64"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            OUTPUT_NAME="gset-linux-arm64"
          fi
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"

      - name: Prepare archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" release/gset.exe
            cd release && 7z a "../${OUTPUT_NAME}.zip" gset.exe
            cd ..
          else
            cp "$BIN" release/gset
            cd release && tar -czf "../${OUTPUT_NAME}.tar.gz" gset
            cd ..
          fi

      - name: Build Debian packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo install cargo-deb --locked
          DEB_ARCH="amd64"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            DEB_ARCH="arm64"
          fi
          mkdir -p target/debian
          cargo deb --no-build --no-strip --package gset-cli --target ${{ matrix.target }} -o target/debian/gset-${{ steps.version.outputs.VERSION }}-${DEB_ARCH}.deb

      - name: Upload Debian packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-deb
          path: target/debian/*.deb
          retention-days: 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.*
          retention-days: 5
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > RELEASE_NOTES.md << EOF
          # GSET v$VERSION Release
          ## Installation
          ### Linux / macOS / Windows (Git Bash)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/Crazygiscool/GSETLang/main/install.sh | bash
          ```
          ### Manual Install
          Download the appropriate archive for your platform from the assets below.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
